version: '3'

tasks:
  build:
    desc: Build the mdv binary (mdv.exe on Windows)
    cmds:
      - go build -tags desktop,production -o mdv{{exeExt}} ./cmd/mdv

  app:
    desc: Build mdv.app (macOS bundle; adds "Open With" support)
    deps: [build]
    cmds:
      - rm -rf mdv.app
      - mkdir -p mdv.app/Contents/MacOS mdv.app/Contents/Resources
      - cp mdv mdv.app/Contents/MacOS/mdv
      - cp build/darwin/Info.plist mdv.app/Contents/Info.plist
      - cp build/darwin/mdv.icns mdv.app/Contents/Resources/mdv.icns
      - codesign --force --sign - mdv.app

  install-app:
    desc: Install mdv.app to /Applications and link it onto PATH as `mdv`
    deps: [app]
    cmds:
      # /Applications, not the repo: `task clean` removes ./mdv.app and would
      # leave the symlink dangling.
      - rm -rf /Applications/mdv.app
      - cp -R mdv.app /Applications/mdv.app
      # One binary for both entry points. Invoked through the symlink,
      # os.Executable reports the link path, so bundled() stays false and mdv
      # keeps its command-line behaviour (usage on no args).
      - mkdir -p "$(go env GOPATH)/bin"
      - ln -sf /Applications/mdv.app/Contents/MacOS/mdv "$(go env GOPATH)/bin/mdv"
      - echo "installed /Applications/mdv.app, linked $(go env GOPATH)/bin/mdv"

  icons:
    desc: Rasterize icon.svg to the dock icon and mdv.icns (needs rsvg-convert)
    sources: ['cmd/mdv/icon.svg']
    generates: ['cmd/mdv/icon.png', 'build/darwin/mdv.icns']
    cmds:
      - rsvg-convert -w 1024 -h 1024 cmd/mdv/icon.svg -o cmd/mdv/icon.png
      - rm -rf build/darwin/mdv.iconset && mkdir -p build/darwin/mdv.iconset
      - |
        for sz in 16 32 128 256 512; do
          rsvg-convert -w $sz -h $sz cmd/mdv/icon.svg \
            -o build/darwin/mdv.iconset/icon_${sz}x${sz}.png
          rsvg-convert -w $((sz*2)) -h $((sz*2)) cmd/mdv/icon.svg \
            -o build/darwin/mdv.iconset/icon_${sz}x${sz}@2x.png
        done
      - iconutil -c icns -o build/darwin/mdv.icns build/darwin/mdv.iconset
      - rm -rf build/darwin/mdv.iconset

  winres:
    desc: Regenerate the Windows exe resources (icon, manifest, version) from icon.png
    sources: ['cmd/mdv/icon.png', 'build/windows/winres.json', 'build/windows/mdv.exe.manifest']
    generates: ['cmd/mdv/rsrc_windows_amd64.syso', 'cmd/mdv/rsrc_windows_arm64.syso']
    cmds:
      - go run github.com/tc-hib/go-winres@v0.3.3 make --in build/windows/winres.json --out cmd/mdv/rsrc --arch amd64,arm64

  install-windows:
    desc: Install mdv.exe to GOPATH/bin and add it to Explorer's "Open with" for .md (per-user)
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File build/windows/install.ps1

  install-windows-default:
    desc: install-windows, plus make mdv the default .md/.markdown handler
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File build/windows/install.ps1 -Default

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf mdv mdv.exe mdv.app

  install-cli-only:
    desc: Install just the CLI binary to GOPATH/bin (replaces any install-app symlink)
    cmds:
      - go install -tags desktop,production ./cmd/mdv
